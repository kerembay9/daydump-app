# Edit: filter preset, apply-to-all (on by default), strength slider.
appId: com.horizonzeta.picdump
name: 13 edit filter
---
- runFlow: subflows/ready.yaml
- runFlow:
    file: subflows/edit.yaml
    env:
      N: 2
- tapOn: "B&W Roll"
- assertVisible:
    text: "B&W Roll"
    selected: true
- assertVisible: "68%"
- assertVisible:
    text: "Apply to all photos"
    checked: true
- assertNotVisible: "Changes apply to this slide only."
- tapOn: "Apply to all photos"
- assertVisible: "Changes apply to this slide only."
- tapOn: "Filter strength"
- assertVisible: "50%"
- waitForAnimationToEnd
- takeScreenshot: vr_edit_bw
- tapOn: "Original"
- assertVisible:
    text: "Original"
    selected: true
