# writes-album: Save only exports the slides to the DayDump album; the Done sheet leads to Library -> Drafts.
appId: com.daydump.app
name: 16 save only -> drafts
---
- runFlow: subflows/ready.yaml
- tapOn: "Preview"
- tapOn: "Save only, to the DayDump album"
- extendedWaitUntil:
    visible: "Saved to your phone"
    timeout: 60000
- assertVisible: ".*saved to the DayDump album\\."
- tapOn: "View in Library"
- assertVisible: "Drafts \\(1\\)"
- tapOn: ".*, draft"
- assertVisible: "Sizes · Filter % · Captions"
