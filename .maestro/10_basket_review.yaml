# Create basket: review sheet (move, remove), start a new dump; the old one stays in Drafts.
appId: com.horizonzeta.picdump
name: 10 basket review
---
- runFlow: subflows/ready.yaml
- runFlow:
    file: subflows/pick.yaml
    env:
      N: 3
- assertVisible: "Continue with 3 photos"
- tapOn: "Picks: 3\\. Review"
- assertVisible: "Your picks \\(3 photos\\)"
- tapOn: "Photo 1"
- tapOn: "Move later"
- tapOn: "Remove photo 3"
- assertVisible: "Your picks \\(2 photos\\)"
- tapOn: "Start a new dump"
- assertVisible: "Continue with 0 photos"
- tapOn: "Library"
- tapOn: "Drafts.*"
- assertVisible: "Drafts \\(1\\)"
- assertVisible: ".*, draft"
