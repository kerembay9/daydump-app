# Edit: filter preset, apply-to-all (on by default), strength slider; caption ideas paging and Copy.
appId: com.horizonzeta.picdump
name: 13 edit filter + captions
---
- runFlow: subflows/ready.yaml
- runFlow:
    file: subflows/edit.yaml
    env:
      N: 2
- tapOn: "B&W Roll"
- assertVisible: "4:5 · B&W Roll 68%"
- assertVisible:
    text: "Apply to all photos"
    checked: true
- assertNotVisible: "Changes apply to this slide only."
- tapOn: "Apply to all photos"
- assertVisible: "Changes apply to this slide only."
- tapOn: "Filter strength"
- assertVisible: "4:5 · B&W Roll 50%"
- waitForAnimationToEnd
- takeScreenshot: vr_edit_bw
- tapOn: "Original"
- assertVisible: "4:5 · Original"
- scrollUntilVisible:
    element: "More caption ideas"
- tapOn: "More caption ideas"
- tapOn:
    text: "Copy caption: .*"
    index: 0
- assertVisible: "Copied"
