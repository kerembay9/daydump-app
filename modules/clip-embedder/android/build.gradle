plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.clipembedder'
version = '0.1.0'

android {
  namespace "expo.modules.clipembedder"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'proguard-rules.pro'
  }
  // Debug builds (Metro, adb installs) carry the packs' models in the APK; release downloads them (ModelPacks.kt).
  sourceSets.debug.assets.srcDirs += ['visionpack/src/main/assets', 'facepack/src/main/assets', 'textpack/src/main/assets']
}

dependencies {
  // Vision tower on the GPU (CompiledModel API); litert-gpu adds the OpenCL/GL accelerator (~3 MB arm64).
  implementation 'com.google.ai.edge.litert:litert:2.3.0'
  implementation 'com.google.ai.edge.litert:litert-gpu:2.3.0'
  // Benchmark engines (EdgeBenchModule, src/debug only; release gets the stub in src/release). ponytail: litertlm pinned to 0.16.1 (stdlib 2.2, metadata 2.3, read via
  // the flag below); 0.17+ pulls stdlib 2.4, which the app's Kotlin 2.1.20 can't compile against. Unpin when Expo moves to Kotlin 2.4.
  debugImplementation 'com.google.ai.edge.litertlm:litertlm-android:0.16.1'
  // Unbundled ML Kit: Play services fetches the model on request instead of adding ~13 MB to every install.
  debugImplementation 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'
  debugImplementation 'com.google.android.gms:play-services-base:18.5.0'
  // Background indexing while charging (BackgroundIndex.kt); both versions are already in the app via other deps.
  implementation 'androidx.work:work-runtime:2.9.1'
  implementation 'androidx.exifinterface:exifinterface:1.3.6' // GPS the same way expo-media-library reads it
  // Release: the big models arrive as asset packs after the install (ModelPacks.kt).
  implementation 'com.google.android.play:asset-delivery:2.3.0'
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  compilerOptions.freeCompilerArgs.add('-Xskip-metadata-version-check')
}
